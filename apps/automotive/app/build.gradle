plugins { id 'com.android.application' }

// Deployment overrides remain exact loopback origins in debug builds only.
def debugOrigin = { String propertyName, String fallback ->
    def value = providers.gradleProperty(propertyName).getOrElse(fallback)
    def uri = new URI(value)
    if (uri.scheme != 'http' || !(uri.host in ['localhost', '127.0.0.1']) ||
        uri.userInfo != null || uri.query != null || uri.fragment != null ||
        !(uri.path in ['', '/']) || uri.port < 1 || uri.port > 65535) {
        throw new GradleException("${propertyName} must be an explicit HTTP loopback origin with a port")
    }
    return '"' + value + '"'
}

android {
    namespace 'more.attune.automotive'
    compileSdk 35
    buildToolsVersion '35.0.0'
    useLibrary 'android.car'

    defaultConfig {
        applicationId 'more.attune.automotive.prototype'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1-prototype'
    }
    buildFeatures { buildConfig true }
    // Native labels follow the existing in-app TR/EN/DE selector offline.
    // Retain all three resource sets if this prototype is packaged as a bundle.
    bundle { language { enableSplit = false } }
    buildTypes {
        debug {
            buildConfigField 'boolean', 'REMOTE_DEMO_CAPTURE', 'false'
            applicationIdSuffix '.debug'
            buildConfigField 'boolean', 'BACKEND_SIMULATION', 'true'
            // adb reverse connects to an isolated host instance of the existing app/API.
            buildConfigField 'String', 'WEB_ORIGIN', debugOrigin('attuneDebugWebOrigin', 'http://localhost:3000')
            buildConfigField 'String', 'API_ORIGIN', debugOrigin('attuneDebugApiOrigin', 'http://localhost:8000')
        }
        release {
            buildConfigField 'boolean', 'REMOTE_DEMO_CAPTURE', 'false'
            minifyEnabled false
            buildConfigField 'boolean', 'BACKEND_SIMULATION', 'false'
            // Intentionally unusable until an authorized provider and deployment are integrated.
            buildConfigField 'String', 'WEB_ORIGIN', '"https://attune.invalid"'
            buildConfigField 'String', 'API_ORIGIN', '"https://attune.invalid"'
        }
        cloudDemo {
            initWith debug
            applicationIdSuffix '.clouddemo'
            versionNameSuffix '-aws-demo'
            matchingFallbacks = ['debug']
            buildConfigField 'boolean', 'REMOTE_DEMO_CAPTURE', 'true'
            // These loopbacks terminate inside the AWS AVD and M8i host only.
            // The M8i proxy authenticates to G6 over private mTLS.
            buildConfigField 'String', 'WEB_ORIGIN', '"http://127.0.0.1:3000"'
            buildConfigField 'String', 'API_ORIGIN', '"http://127.0.0.1:3000"'
        }
    }
    sourceSets { cloudDemo { res.srcDirs += 'src/debug/res' } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}
