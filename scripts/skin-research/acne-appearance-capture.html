<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yerel görünüm işaretleme</title>
<style>body{font:16px system-ui;max-width:1000px;margin:24px auto;padding:12px}label{display:block;margin:8px}canvas,video{max-width:100%;touch-action:none}button,input,select{font:inherit;margin:4px}canvas{border:1px solid #888}#message{white-space:pre-wrap}</style>
<h1>Yerel görünüm-adayı mühendislik kaydı</h1><p>Ürün taraması veya klinik değerlendirme değildir. Ağ yüklemesi yoktur. Gerçek izin kaydı olmadan fotoğraf açmayın/çekmeyin. Gözlüğünüzü çıkarın. Eksik bilgileri uydurmayın.</p>
<label>Rıza kayıt kimliği <input id="consent"></label><label>Kullanım hakkı kayıt kimliği <input id="rights"></label><label>İzin kapsamı <input id="scope"></label><label>Geri çekme yolu <input id="withdraw"></label><label>Kişi grup kimliği (isim değil) <input id="person"></label><label>Kaynak grup kimliği <input id="group"></label><label>İnceleyen kimliği <input id="reviewer"></label><label>Işık/cihaz/çekim notu <input id="light"></label><label>Poz <select id="pose"><option>FRONT</option><option>LEFT</option><option>RIGHT</option></select></label>
<label><input id="permission" type="checkbox">Bu yerel geçici işleme için kayıtlı izni doğruladım.</label>
<button id="start">Kamerayı aç</button><button id="stop">Kamerayı kapat</button><button id="capture">Tek kare al</button><input id="file" type="file" accept="image/png,image/jpeg"><video id="video" autoplay muted playsinline></video>
<p>Kaynak üzerinde dikdörtgen sürükleyin; boş alan UNKNOWN kalır.</p><select id="kind"><option value="candidate">Görünür aday kutusu</option><option value="reviewed-negative">İncelenmiş negatif alan</option><option value="unknown">Belirsiz alan</option><option value="unmeasurable">Ölçülemeyen alan</option></select><select id="subtype"><option value="unknown">Alt tür bilinmiyor</option><option value="red">İncelenmiş kırmızı görünüm</option><option value="pale-white">İncelenmiş soluk/beyaz görünüm</option><option value="skin-colored">İncelenmiş ten rengi görünüm</option></select><button id="undo">Son kutuyu geri al</button><canvas id="canvas"></canvas>
<label><input id="retain" type="checkbox">Bu fotoğrafın yerel PNG olarak kalıcı dışa aktarımı için ayrı izni doğruladım.</label><button id="json">Pikselsiz JSON indir</button><button id="png">Ayrı izinli PNG indir</button><button id="clear">Geçici kare ve kutuları sil</button><pre id="message"></pre>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');let stream=null,source=null,boxes=[],down=null,settings=null,capturedAt=null,generation=0;
const metadata=()=>{const out={};for(const id of ['consent','rights','scope','withdraw','person','group','reviewer','light']){out[id]=$(id).value.trim();if(!out[id])throw Error('Eksik kayıt: '+id);}if(!$('permission').checked)throw Error('Geçici işleme izni gerekli');return out;};
const notify=e=>$('message').textContent=String(e.message||e);
const guard=fn=>async()=>{try{await fn();}catch(e){notify(e);}};
function stop(){generation++;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null;}
function clear(){source=null;boxes=[];settings=null;capturedAt=null;canvas.width=canvas.height=0;notify('Geçici kare silindi; indirilen dosyalar tarayıcı tarafından geri silinmez.');}
function draw(){if(!source)return;ctx.drawImage(source,0,0);for(const b of boxes){ctx.strokeStyle=b.kind==='candidate'?'#ff7000':b.kind==='reviewed-negative'?'#00c040':'#888';ctx.lineWidth=2;ctx.strokeRect(b.box[0],b.box[1],b.box[2]-b.box[0],b.box[3]-b.box[1]);}}
function accept(image){source=document.createElement('canvas');source.width=image.videoWidth||image.naturalWidth||image.width;source.height=image.videoHeight||image.naturalHeight||image.height;source.getContext('2d').drawImage(image,0,0);canvas.width=source.width;canvas.height=source.height;boxes=[];capturedAt=new Date().toISOString();draw();notify(`${canvas.width} × ${canvas.height}; kaynak ölçeklenmedi.`);}
function pngBlob(){if(!source)throw Error('Kare yok');return new Promise(resolve=>source.toBlob(resolve,'image/png'));}
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('start').onclick=guard(async()=>{metadata();stop();const token=generation,acquired=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1920},height:{ideal:1080}},audio:false});if(token!==generation||!$('permission').checked){acquired.getTracks().forEach(t=>t.stop());return;}stream=acquired;$('video').srcObject=stream;await $('video').play();if(token!==generation||!stream)return;settings=stream.getVideoTracks()[0].getSettings();notify('Gerçek track: '+JSON.stringify(settings));});
$('stop').onclick=stop;$('clear').onclick=()=>{stop();clear();};
$('capture').onclick=guard(()=>{metadata();if(!stream||!$('video').videoWidth)throw Error('Kamera hazır değil');accept($('video'));stop();});
$('file').onchange=guard(async()=>{let url=null;try{metadata();stop();const token=generation,file=$('file').files[0];if(!file)return;url=URL.createObjectURL(file);const image=new Image();image.src=url;await image.decode();if(token!==generation||!$('permission').checked)return;settings={source:'local-file',cameraSettings:'unknown'};accept(image);}finally{if(url)URL.revokeObjectURL(url);$('file').value='';}});
function point(e){const r=canvas.getBoundingClientRect();return [Math.min(canvas.width,Math.max(0,(e.clientX-r.left)*canvas.width/r.width)),Math.min(canvas.height,Math.max(0,(e.clientY-r.top)*canvas.height/r.height))];}
canvas.onpointerdown=e=>{if(!source)return;down=point(e);canvas.setPointerCapture(e.pointerId);};canvas.onpointerup=e=>{if(!down)return;const p=point(e),box=[Math.min(down[0],p[0]),Math.min(down[1],p[1]),Math.max(down[0],p[0]),Math.max(down[1],p[1])];down=null;if(box[2]-box[0]<2||box[3]-box[1]<2)return;boxes.push({box,coordinateSpace:'source-pixels',kind:$('kind').value,appearanceSubtype:$('kind').value==='candidate'?$('subtype').value:'not-applicable'});draw();};canvas.onpointercancel=()=>down=null;
$('undo').onclick=()=>{boxes.pop();draw();};
$('json').onclick=guard(async()=>{const current=source,token=generation,m=metadata(),blob=await pngBlob(),sha=[...new Uint8Array(await crypto.subtle.digest('SHA-256',await blob.arrayBuffer()))].map(v=>v.toString(16).padStart(2,'0')).join('');if(current!==source||token!==generation||!$('permission').checked)throw Error('Kare veya izin değişti; dışa aktarım iptal edildi');const record={version:'acne-appearance-engineering-v1',photoSHA256:sha,photoHashDefinition:'opaque source canvas PNG, before annotation overlay',consentRecordId:m.consent,rightsRecordId:m.rights,consentScope:m.scope,withdrawalRoute:m.withdraw,personGroupId:m.person,sourceGroupId:m.group,reviewerId:m.reviewer,light:m.light,reviewScope:'visible annotation rectangles only; outside UNKNOWN',annotationVersion:'appearance-boxes-v1',captureProtocolVersion:'eyewear-free-capture-v1',eyewear:'requires actual product gate',pose:$('pose').value,device:navigator.userAgent,trackSettings:settings,snapshotWidth:current.width,snapshotHeight:current.height,capturedAt,labels:boxes,reviewerRole:'internal-engineering; not dermatologist',quality:'requires actual product capture gates before evaluation',unknownOutsideBoxes:true,persistentPhotoPermission:$('retain').checked,rawPixelsIncluded:false};download(new Blob([JSON.stringify(record,null,2)],{type:'application/json'}),sha+'-annotations.json');});
$('png').onclick=guard(async()=>{const current=source,token=generation;metadata();if(!$('retain').checked)throw Error('Ayrı kalıcı fotoğraf izni gerekli');const blob=await pngBlob();metadata();if(current!==source||token!==generation||!$('retain').checked)throw Error('Kare veya ayrı fotoğraf izni değişti; dışa aktarım iptal edildi');download(blob,'consented-source.png');});
$('permission').onchange=()=>{if(!$('permission').checked){stop();clear();}};window.addEventListener('pagehide',()=>{stop();clear();});
</script></html>
