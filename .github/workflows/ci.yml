name: CI / Submission QA Guard

on:
  push:
    branches: [ "main", "work/skin-roadmap-20261023" ]
    paths-ignore:
      - "docs/skin/**"
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend Unit Tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # The preserved-layout regression reads its actual historical baseline.
        fetch-depth: 0

    - name: Set up pinned Node.js 22.20.0
      uses: actions/setup-node@v4
      with:
        node-version: "22.20.0"
        cache: "npm"

    - name: Install Node regression dependencies
      run: npm ci

    - name: Run skin presentation localization contract
      run: npm run test:skin-presentation

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Checkout pinned YOLOX graph-test source (no weights)
      uses: actions/checkout@v4
      with:
        repository: Megvii-BaseDetection/YOLOX
        ref: 6ddff4824372906469a7fae2dc3206c7aa4bbaee
        path: .ci-deps/yolox
        persist-credentials: false

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r services/core-api/requirements.txt
        # Import-only research/math regressions; no training or model export.
        pip install psutil==7.2.2 safetensors==0.7.0 pycocotools==2.0.10
        pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
        # Import dependencies of the pinned graph's utils; no exporter/trainer extras.
        pip install loguru==0.7.3 tabulate==0.9.0 tqdm==4.67.1 thop==0.1.1.post2209072238

    - name: Run deterministic unit test suite
      env:
        PYTHONPATH: ${{ github.workspace }}/.ci-deps/yolox
      run: |
        pytest tests/unit \
          scripts/skin-research/tests/test_summarize_current_merged_skin_output.py \
          scripts/skin-research/tests/test_audit_acne_dataset_geometry.py \
          scripts/skin-research/tests/test_build_acne_source_group_review.py \
          scripts/skin-research/tests/test_check_acne_split_release.py \
          scripts/skin-research/tests/test_build_acne_semantic_review_queue.py \
          scripts/skin-research/tests/test_build_acne_group_coverage_proposal.py \
          -v -ra

    - name: Run complete skin research evidence suite
      if: always()
      run: python -m unittest discover -s scripts/skin-research/tests -p 'test_*.py'

  frontend-build:
    name: Frontend Production Build (Node.js 22.20.0)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up pinned Node.js 22.20.0
      uses: actions/setup-node@v4
      with:
        node-version: "22.20.0"

    - name: Install dependencies
      run: |
        npm ci

    - name: Run Next.js Production Build
      run: |
        cd apps/vehicle-app
        npm run build
